# fly.toml app configuration file for Falcon
app = "falcon-api-tejiri"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  PYTHONUNBUFFERED = "1"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "120s"
    interval = "20s"
    method = "GET"
    path = "/api/v1/health"
    protocol = "http"
    timeout = "15s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
